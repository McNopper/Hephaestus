# plugin_customization.ini - shipped defaults for the OpenCode harness.
#
# Seeded into a FRESH workspace on first start when Eclipse is launched with
#   -pluginCustomization plugin_customization.ini
# (deploy-dev.ps1 copies this file next to eclipse.exe and adds that flag).
# A user can still override every value in Preferences; these are defaults,
# not locks.
#
# New-user alternative: skip this file entirely and OPEN THE REPO FOLDER as
# a workspace project - the adoption rules then find the store and the scope
# automatically (see docs/own-project.md, "First Eclipse start").

# Where the repo lives on THIS machine (the connection scope: MCP servers,
# agents and skills are all directory-scoped to it).
com.opencode.ide.core/workingDirectory=C\:/Development/GitHub/Hephaestus

# The task store (the parent of the per-project folders).
com.opencode.ide.core/tasksRoot=C\:/Development/GitHub/Hephaestus/.opencode/tasks

# The project to show on the Board.
com.opencode.ide.core/tasksProject=hephaestus
